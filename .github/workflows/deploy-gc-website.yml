name: Deploy GC Website

on:
  push:
    branches: [cursor/southern-nh-gc-automation-4d44]
    paths:
      - "examples/southern_nh_gc/website/**"
      - ".github/workflows/deploy-gc-website.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gc-website-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build website
        run: python3 examples/southern_nh_gc/website/build_site.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: examples/southern_nh_gc/website

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
